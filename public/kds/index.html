<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen Display</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root { --bg:#f3f1ec; --card:#fff; --ink:#1d1b18; --mute:#6b665e; --line:#d9d4c9; --accent:#9c2a1a; --ok:#2f6b3a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16140f; --card:#221f19; --ink:#f1ede4; --mute:#a39d90; --line:#3a352b; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:12px; padding:10px 14px; border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0; flex:1; }
  button { font:inherit; min-height:44px; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.tab[aria-pressed="true"] { background:var(--ink); color:var(--bg); }
  .cols { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; padding:12px; align-items:start; }
  @media (max-width: 800px) { .cols { grid-template-columns:1fr; } }
  .col h2 { margin:0 0 8px; font-size:16px; text-align:center; }
  .card { background:var(--card); border:2px solid var(--line); border-radius:10px; padding:12px; margin-bottom:12px; }
  .card.diet { border-color:#c0392b; } .card.recook { border-color:#d4a017; } .card.diet.recook { border-color:#e67e22; }
  .name { font-weight:700; font-size:20px; padding-bottom:6px; border-bottom:1px solid var(--line); }
  .warn { color:#c0392b; font-weight:700; margin-bottom:6px; }
  .recook-note { color:#b07d00; font-weight:700; }
  ul { padding-left:18px; margin:8px 0; } li { margin-bottom:6px; font-size:17px; } li em { display:block; color:var(--mute); }
  .times { display:flex; gap:12px; flex-wrap:wrap; color:var(--mute); font-size:14px; padding:6px 0; border-top:1px solid var(--line); }
  .row { display:flex; gap:8px; margin-top:8px; } .row > * { flex:1; }
  .row.contact > input { flex:3; } .row.contact > button.small { flex:0 0 auto; min-width:64px; }
  input[type=text], input[type=tel], input[type=email], input[type=password] { width:100%; min-height:44px; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font:inherit; }
  .login { max-width:360px; margin:12vh auto; padding:16px; } .login input { margin-bottom:10px; }
  .err { color:#c0392b; margin:8px 0; } .hint { color:var(--mute); font-size:14px; }
  @keyframes flash { 50% { background: var(--flash); } }
  .card.age5 { --flash: rgba(255,214,10,.45); animation: flash 2s ease-in-out infinite; }
  .card.age7 { --flash: rgba(255,140,0,.5);  animation: flash 1.2s ease-in-out infinite; }
  .card.age10 { --flash: rgba(220,40,30,.55); animation: flash .6s ease-in-out infinite; }
  .card.quiet5 { box-shadow: inset 0 0 0 3px rgba(255,214,10,.8); }
  .card.quiet7 { box-shadow: inset 0 0 0 3px rgba(255,140,0,.85); }
  .card.quiet10 { box-shadow: inset 0 0 0 3px rgba(220,40,30,.85); }
  .card[class*="age"] { cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { .card.age5, .card.age7, .card.age10 { animation: none; background: var(--flash); } }
  button.icon { flex:0 0 auto; min-width:44px; padding:8px; display:inline-flex; align-items:center; justify-content:center; }
  .phone { flex:1; font-size:16px; display:flex; align-items:center; gap:6px; } .phone.none { color:var(--mute); }
  .diet-line { display:flex; align-items:center; gap:6px; } .diet-line .warn { flex:1; margin:0; }
  .age { font-weight:700; } .age.a5 { color:#b08900; } .age.a7 { color:#d06a00; } .age.a10 { color:#c0281e; }
  .empty { color:var(--mute); text-align:center; padding:16px; }
</style>
</head>
<body>
<div id="app"></div>
<audio id="bell" src="bell.mp3" preload="auto"></audio>
<script>
const CFG = window.KDS_CONFIG || {};  // set in config.js: { SUPABASE_URL, SUPABASE_ANON_KEY }
</script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(window.KDS_CONFIG.SUPABASE_URL, window.KDS_CONFIG.SUPABASE_ANON_KEY);
const app = document.getElementById('app');
const TZ = 'America/New_York';
const LEAD_MIN = 15;  // a scheduled order moves to New this many minutes before its pickup time
const editing = new Set(), drafts = {};   // cards whose phone/dietary fields are open for editing
const PENCIL = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>';
let view = 'active', orders = [], seen = null, err = '';
// When the kitchen clock starts for an order: the order time, or for scheduled orders the release time.
const releaseAt = (o) => o.scheduled_pickup_at ? new Date(new Date(o.scheduled_pickup_at) - LEAD_MIN * 60e3) : new Date(o.received_at);
// The clock restarts whenever the order changes status (so it measures time in the current status).
const clockStart = (o) => new Date(Math.max(releaseAt(o).getTime(), o.status_changed_at ? new Date(o.status_changed_at).getTime() : 0));
const isHeld = (o) => o.status === 'new' && releaseAt(o) > new Date();
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmt = (t) => t ? new Date(t).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', timeZone:TZ }) : '';
const today = () => new Date().toLocaleDateString('en-CA', { timeZone: TZ });

async function boot() {
  const { data } = await sb.auth.getSession();
  if (!data.session) return loginScreen();
  await load();
  setInterval(load, 5000);
  sb.channel('orders').on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, load).subscribe();
}

function loginScreen(msg = '') {
  app.innerHTML = `<form class="login"><h1>Kitchen Display</h1>
    <input type="email" id="em" placeholder="Email" autocomplete="username" required>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" required>
    <button class="primary" style="width:100%">Sign in</button><div class="err">${esc(msg)}</div></form>`;
  app.querySelector('form').onsubmit = async (e) => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: em.value, password: pw.value });
    error ? loginScreen(error.message) : location.reload();
  };
}

async function load(force = false) {
  const start = new Date(today() + 'T00:00:00'); // local midnight; wide enough, filtered below by Eastern date
  const { data, error } = await sb.from('orders')
    .select('id,first_name,last_name,phone,dietary_notes,status,received_at,scheduled_pickup_at,status_changed_at,alert_acked_at,cooking_started_at,cooking_ended_at,picked_up_at,recook_reason,unit_number,order_items(line_no,item_name,variation_name,modifiers,quantity)')
    .or(`received_at.gte.${new Date(Date.now() - 36 * 3600e3).toISOString()},scheduled_pickup_at.gte.${new Date(Date.now() - 36 * 3600e3).toISOString()}`)
    .neq('status', 'cancelled').order('received_at', { ascending: false });
  if (error) { err = error.message; return render(true); }
  err = '';
  const day = (d) => new Date(d).toLocaleDateString('en-CA', { timeZone: TZ });
  // Held (scheduled, not yet due) orders are kept for any future day; everything else must be today's.
  orders = data.filter((o) => isHeld(o) ? true : day(o.scheduled_pickup_at || o.received_at) === today());
  const ids = new Set(orders.filter((o) => !isHeld(o)).map((o) => o.id));
  if (seen && [...ids].some((i) => !seen.has(i))) document.getElementById('bell').play().catch(() => {});
  seen = ids;
  render(force);
}

function card(o) {
  const items = (o.order_items || []).sort((a, b) => a.line_no - b.line_no).map((i) =>
    `<li><strong>${i.quantity > 1 ? i.quantity + ' × ' : ''}${esc(i.item_name)} ${esc(i.variation_name || '')}</strong>${i.modifiers ? `<em>${esc(i.modifiers)}</em>` : ''}</li>`).join('');
  const btns = {
    new: isHeld(o)
      ? `<button data-a="release">Release now</button><button data-a="later">Change time</button>`
      : `<button data-a="later">Later</button><button class="primary" data-a="cooking">Start cooking</button>`,
    cooking: `<button data-a="new">Back to new</button><button class="primary" data-a="completed">Completed</button>`,
    completed: `<button data-a="recook">Re-cook</button><button class="primary" data-a="picked_up">Picked up</button>`,
    picked_up: `<button data-a="recook">Re-cook</button>`,
  }[o.status] || '';
  const d = drafts[o.id] || {};
  // Read-only with a pencil by default; a blank field shows an entry box straight away.
  const ed = editing.has(o.id), showPhone = ed || !o.phone, showDiet = ed || !o.dietary_notes;
  const pencil = `<button class="icon" data-a="edit" aria-label="Edit phone and dietary note" title="Edit">${PENCIL}</button>`;
  const phoneCell = showPhone
    ? `<input type="tel" placeholder="Phone" value="${esc(d.phone ?? o.phone ?? '')}" data-f="phone">`
    : `<div class="phone">${esc(o.phone)}${pencil}</div>`;
  const contact = `<div class="row contact">${phoneCell}${o.phone && !ed ? '<button data-a="text" class="small">Text</button>' : ''}${(showPhone || showDiet) ? '<button data-a="save" class="small">Save</button>' : ''}${ed ? '<button data-a="cancel" class="small">Cancel</button>' : ''}</div>
    ${showDiet
      ? `<div class="row"><input type="text" placeholder="Dietary note" value="${esc(d.diet ?? o.dietary_notes ?? '')}" data-f="diet"></div>`
      : `<div class="diet-line"><div class="warn">Dietary: ${esc(o.dietary_notes)}</div>${showPhone ? '' : pencil}</div>`}`;
  const aging = o.status === 'new' || o.status === 'cooking';
  const sched = o.scheduled_pickup_at ? `<div class="warn" style="color:var(--ink)">Pickup ${fmt(o.scheduled_pickup_at)}</div>` : '';
  return `<div class="card ${o.dietary_notes ? 'diet' : ''} ${o.recook_reason ? 'recook' : ''}" data-id="${o.id}" ${aging ? `data-since="${clockStart(o).getTime()}" data-ack="${o.alert_acked_at ? new Date(o.alert_acked_at).getTime() : ''}"` : ''}>
    ${sched}
    <div class="name">${esc(o.first_name)} ${esc(o.last_name)}${o.unit_number ? ' · Unit ' + esc(o.unit_number) : ''}</div>
    ${contact}
    <ul>${items}</ul>
    ${o.recook_reason ? `<div class="recook-note">Re-cook: ${esc(o.recook_reason)}</div>` : ''}
    <div class="times"><span>Ordered ${fmt(o.received_at)}</span>${aging ? '<span class="age"></span><span class="hint ackhint"></span>' : ''}${o.cooking_started_at ? `<span>Cooking ${fmt(o.cooking_started_at)}</span>` : ''}${o.cooking_ended_at ? `<span>Done ${fmt(o.cooking_ended_at)}</span>` : ''}${o.picked_up_at ? `<span>Picked up ${fmt(o.picked_up_at)}</span>` : ''}</div>
    <div class="row">${btns}</div></div>`;
}

// Updates the age text and flash level on existing cards without rebuilding them (so typing isn't interrupted).
function tick() {
  const now = Date.now();
  document.querySelectorAll('.card[data-since]').forEach((c) => {
    const mins = Math.max(0, Math.floor((now - Number(c.dataset.since)) / 60000));
    const lvl = mins >= 10 ? 10 : mins >= 7 ? 7 : mins >= 5 ? 5 : 0;
    c.classList.remove('age5', 'age7', 'age10', 'quiet5', 'quiet7', 'quiet10');
    // Flash once the order has waited 5 minutes, then again every 5 minutes after the last acknowledgement.
    // Colour reflects total wait; between acknowledgements the card keeps a steady outline.
    const ref = Math.max(Number(c.dataset.since), Number(c.dataset.ack) || 0);
    if (lvl) c.classList.add(now - ref >= 5 * 60000 ? 'age' + lvl : 'quiet' + lvl);
    const a = c.querySelector('.age');
    if (a) { a.textContent = mins + ' min'; a.className = 'age' + (lvl ? ' a' + lvl : ''); }
    const h = c.querySelector('.ackhint');
    if (h) h.textContent = c.className.match(/\bage\d/) ? 'Tap card to acknowledge (flashes again in 5 min)' : '';
  });
  // A scheduled order that has just become due moves from Scheduled into New.
  if (orders.some((o) => o.status === 'new' && o.scheduled_pickup_at && !isHeld(o) && !document.querySelector(`.card[data-id="${o.id}"]`)) && view === 'active') load();
}
setInterval(tick, 5000);

function render(force = false) {
  if (!force && document.activeElement && document.activeElement.matches('input')) return; // don't wipe typing
  const by = (s) => orders.filter((o) => o.status === s && !isHeld(o));
  const held = orders.filter(isHeld).sort((a, b) => new Date(a.scheduled_pickup_at) - new Date(b.scheduled_pickup_at));
  const col = (title, list, asc) => `<div class="col"><h2>${title} (${list.length})</h2>${
    (asc ? list.sort((a, b) => (b.recook_reason ? 1 : 0) - (a.recook_reason ? 1 : 0) || new Date(a.cooking_started_at) - new Date(b.cooking_started_at))
         : list.sort((a, b) => clockStart(a) - clockStart(b))).map(card).join('') || '<div class="empty">None</div>'}</div>`;
  app.innerHTML = `<header><h1>Kitchen Display</h1>
    <button class="tab" aria-pressed="${view === 'active'}" data-v="active">Active</button>
    <button class="tab" aria-pressed="${view === 'scheduled'}" data-v="scheduled">Scheduled (${held.length})</button>
    <button class="tab" aria-pressed="${view === 'picked'}" data-v="picked">Picked up</button>
    <button data-v="out">Sign out</button></header>
    ${err ? `<div class="err" style="padding:0 14px">${esc(err)}</div>` : ''}
    <div class="cols">${view === 'active' ? col('New', by('new')) + col('Cooking', by('cooking'), true) + col('Completed', by('completed'))
      : view === 'scheduled' ? `<div class="col" style="grid-column:1/-1"><h2>Scheduled for later (${held.length})</h2>${held.map(card).join('') || '<div class="empty">None</div>'}</div>`
      : col('Picked up', by('picked_up').reverse())}</div>`;
  tick();
}

app.addEventListener('input', (e) => {
  const f = e.target.dataset?.f, c = e.target.closest('.card'); if (!f || !c) return;
  (drafts[c.dataset.id] ||= {})[f === 'phone' ? 'phone' : 'diet'] = e.target.value;
});

app.addEventListener('click', async (e) => {
  // Tap anywhere on a flashing card (outside its buttons and fields) to acknowledge it.
  const flashing = e.target.closest('.card[class*="age"]:not([class*="quiet"])');
  if (flashing && !e.target.closest('button, input, a')) {
    const lvl = ['age10', 'age7', 'age5'].map((c) => flashing.classList.contains(c) && Number(c.slice(3))).find(Boolean);
    if (lvl) {
      flashing.dataset.ack = String(Date.now()); tick();            // silence immediately on this screen
      sb.rpc('kds_ack', { p_order: flashing.dataset.id }).then(({ error }) => { if (error) err = 'Could not acknowledge: ' + error.message; load(true); });
    }
    return;
  }
  const v = e.target.closest('[data-v]');
  if (v) { if (v.dataset.v === 'out') { await sb.auth.signOut(); return location.reload(); } view = v.dataset.v; return render(); }
  const b = e.target.closest('[data-a]'); if (!b) return;
  const cardEl = b.closest('.card'), id = cardEl.dataset.id, a = b.dataset.a;
  if (a === 'edit') { editing.add(id); render(true); cardEl.isConnected && document.querySelector(`.card[data-id="${id}"] [data-f=phone]`)?.focus(); return; }
  if (a === 'cancel') { editing.delete(id); delete drafts[id]; return render(true); }
  b.disabled = true;
  let r;
  if (a === 'recook') { const why = prompt('Reason for re-cooking this order?'); if (!why) { b.disabled = false; return; } r = await sb.rpc('kds_recook', { p_order: id, p_reason: why }); }
  else if (a === 'save') {
    // A field that is showing as plain text (already saved) has no input; keep its saved value.
    const o = orders.find((x) => x.id === id);
    const phoneEl = cardEl.querySelector('[data-f=phone]'), dietEl = cardEl.querySelector('[data-f=diet]');
    const phone = phoneEl ? phoneEl.value : (o.phone || '');
    const diet = dietEl ? dietEl.value : (o.dietary_notes || '');
    r = await sb.rpc('kds_set_contact', { p_order: id, p_phone: phone, p_dietary: diet });
    const sug = r.data?.saved_dietary;
    if (!r.error) { editing.delete(id); delete drafts[id]; }
    if (!r.error && sug && dietEl && !diet) alert('Saved dietary note for this customer: ' + sug);
  } else if (a === 'text') {
    const o = orders.find((x) => x.id === id);
    const msg = prompt('Edit message before sending:', `Hi ${o.first_name}, your order is ready for pickup!`);
    if (!msg) { b.disabled = false; return; }
    const { data: s } = await sb.auth.getSession();
    const resp = await fetch(window.KDS_CONFIG.SUPABASE_URL + '/functions/v1/send-text', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: window.KDS_CONFIG.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + s.session.access_token }, body: JSON.stringify({ orderId: id, message: msg }) });
    alert(resp.ok ? 'Message sent' : 'Text failed'); b.disabled = false; return;
  } else if (a === 'later') {
    const t = prompt('Pickup time today (for example 2:30 PM)');
    if (!t) { b.disabled = false; return; }
    const m = t.trim().match(/^(\d{1,2})(?::(\d{2}))?\s*([ap]m?)?$/i);
    if (!m) { alert('Please enter a time like 2:30 PM'); b.disabled = false; return; }
    let h = Number(m[1]); const min = m[2] || '00', ap = (m[3] || '').toLowerCase();
    if (ap.startsWith('p') && h < 12) h += 12; if (ap.startsWith('a') && h === 12) h = 0;
    if (h > 23 || Number(min) > 59) { alert('Please enter a valid time'); b.disabled = false; return; }
    r = await sb.rpc('kds_schedule', { p_order: id, p_date: today(), p_time: String(h).padStart(2, '0') + ':' + min });
  } else if (a === 'release') {
    // Release = move to New now. The clock then starts at this moment rather than when the order was placed.
    const t = new Date(Date.now() + LEAD_MIN * 60e3).toLocaleTimeString('en-GB', { timeZone: TZ, hour12: false, hour: '2-digit', minute: '2-digit' });
    r = await sb.rpc('kds_schedule', { p_order: id, p_date: today(), p_time: t });
  } else r = await sb.rpc('kds_set_status', { p_order: id, p_status: a });
  if (r.error) alert('Could not save: ' + r.error.message);
  document.activeElement?.blur(); await load(true);
});
boot();
</script>
</body>
</html>
